server:
  port: 8080

agent:
  tool:
    max-rounds: 8
    max-retries: 2
    retry-base-ms: 800
    retry-jitter-ms: 1200
  fact-check:
    enabled: true
    max-rounds: 2
  memory:
    # 会话层动态 Token 窗口的预算：超过预算的历史消息按重要性由低到高被裁掉
    token-budget: 2400
    # 会话窗口的消息条数安全上限
    max-records: 30

rag:
  rerank:
    base-url: http://localhost:11434
    model: dengcao/Qwen3-Reranker-0.6B:Q8_0
    timeout-seconds: 30

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 7
      timeout: 10s
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stock-analysis-local?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: 23009201435
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jmx:
    enabled: false
