server:
  port: 8080

agent:
  # 本地 Ollama 服务与模型；换模型只改这里，不用改代码
  llm:
    base-url: http://localhost:11434
    model: qwen3:8b
  embedding:
    base-url: http://localhost:11434
    # bge-base-zh-v1.5：768 维中文嵌入，与 LocalVectorService#VECTOR_DIMENSION 对应
    model: quentinz/bge-base-zh-v1.5:latest
  tool:
    max-rounds: 8
    max-retries: 2
    retry-base-ms: 800
    retry-jitter-ms: 1200
  fact-check:
    enabled: true
    max-rounds: 2
  memory:
    # 会话层动态 Token 窗口的预算：超过预算的历史消息按重要性由低到高被裁掉
    token-budget: 2400
    # 会话窗口的消息条数安全上限
    max-records: 30

rag:
  rerank:
    base-url: http://localhost:11434
    model: dengcao/Qwen3-Reranker-0.6B:Q8_0
    timeout-seconds: 30

spring:
  application:
    name: java-code-agent
  data:
    redis:
      host: localhost
      port: 6379
      database: 7
      timeout: 10s
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stock-analysis-local?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    # 凭据不入库：本地运行时用环境变量注入，例如
    #   PowerShell:  $env:MYSQL_USERNAME='root'; $env:MYSQL_PASSWORD='你的密码'
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jmx:
    enabled: false
